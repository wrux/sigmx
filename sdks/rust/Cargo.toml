[package]
name = "sigmx"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Rust SDK for sigmx: read signals from a request, answer with HTML, JSON or a stream of patches, and ship the client from a Rust-only build. Works on native servers and Cloudflare Workers (wasm32)."
license = "MIT"
authors = ["Callum Bonnyman"]
repository = "https://github.com/wrux/sigmx"
homepage = "https://github.com/wrux/sigmx#readme"
documentation = "https://docs.rs/sigmx"
readme = "README.md"
keywords = ["sigmx", "hypermedia", "sse", "axum", "cloudflare"]
categories = ["web-programming", "wasm"]
# The embedded client (client/) is generated by `npm run build` at the repository root and is not
# committed; listing it here ships it in the published crate.
include = ["src/**", "client/**", "build.rs", "examples/axum.rs", "README.md", "LICENSE"]
autoexamples = false

[package.metadata.docs.rs]
all-features = true

[lib]
name = "sigmx"
path = "src/lib.rs"

[[bin]]
name = "sigmx"
path = "src/bin/sigmx.rs"
required-features = ["cli"]

[[example]]
name = "axum"
path = "examples/axum.rs"
required-features = ["axum", "client"]

[features]
default = ["json", "client"]
# Signals as serde_json values: `PatchSignals::from_value`, `read_signals`, the request extractors.
json = ["dep:serde", "dep:serde_json", "dep:form_urlencoded"]
# The embedded client: the script-tag build and the ESM tree, with helpers to write or serve them.
client = []
# Auto mode without Node: scan source for the directives and functions in use, generate the entry module.
scan = []
# Streaming responses driven by a channel or a future (no runtime required).
stream = ["dep:futures-core", "dep:futures-channel"]
# `http::Response` builders and `http::Request` readers for any tower/hyper style framework.
http = ["dep:http", "json"]
# Axum 0.8 extractors and responses. Does not enable axum's `tokio` feature, so it builds for wasm32.
axum = ["dep:axum", "dep:bytes", "http", "stream"]
# Cloudflare Workers: `worker::Response` builders and `worker::Request` readers.
worker = ["dep:worker", "json", "stream"]
# The `sigmx` binary: `sigmx client standalone|unpack`, `sigmx scan`, `sigmx entry`.
cli = ["client", "scan"]

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["std"] }
serde_json = { version = "1", optional = true, default-features = false, features = ["std"] }
form_urlencoded = { version = "1", optional = true }
futures-core = { version = "0.3", optional = true, default-features = false }
futures-channel = { version = "0.3", optional = true, default-features = false, features = ["std"] }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
axum = { version = "0.8", optional = true, default-features = false }
worker = { version = "0.8", optional = true, features = ["http"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = "0.27"
tempfile = "3"

[workspace]
members = [".", "examples/worker", "examples/worker/assetc"]
default-members = ["."]
resolver = "2"

# For the Worker example (cargo only honours profiles at the workspace root): smallest wasm wins cold
# start. A project depending on this crate sets its own.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
