<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sigmx + Vite</title>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  <main class="mx-auto max-w-2xl space-y-6 px-4 py-12">
    <header class="space-y-1">
      <h1 class="text-3xl font-bold tracking-tight">sigmx + Vite</h1>
      <p class="text-zinc-500 dark:text-zinc-400">Installed from npm, bundled by Vite, plugins chosen by auto mode, styled with Tailwind.</p>
    </header>

    <section class="space-y-3 rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900" data-signals="{ count: 0 }">
      <h2 class="text-lg font-semibold">Signals</h2>
      <div class="flex items-center gap-3">
        <button type="button" class="rounded-lg bg-teal-600 px-3 py-1.5 font-semibold text-white hover:bg-teal-500" data-on:click="$count--">−</button>
        <b class="inline-block min-w-[3ch] text-center text-xl tabular-nums" data-text="$count">0</b>
        <button type="button" class="rounded-lg bg-teal-600 px-3 py-1.5 font-semibold text-white hover:bg-teal-500" data-on:click="$count++">+</button>
        <span class="rounded-full bg-amber-100 px-2.5 py-0.5 text-sm text-amber-800 dark:bg-amber-900/40 dark:text-amber-200" data-cloak data-show="$count > 4">that is a lot of clicks</span>
      </div>
    </section>

    <section class="space-y-3 rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900" data-signals="{ name: '' }">
      <h2 class="text-lg font-semibold">Binding and a custom plugin</h2>
      <input class="w-full rounded-lg border border-zinc-300 bg-transparent px-3 py-2 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/30 dark:border-zinc-700" data-bind:name placeholder="Your name">
      <p data-cloak>Shouted: <b class="tracking-wide" data-upper="$name || 'nobody'"></b></p>
      <div class="flex items-center gap-3">
        <button type="button" class="rounded-lg bg-zinc-900 px-3 py-1.5 font-semibold text-white hover:bg-zinc-700 disabled:opacity-50 dark:bg-zinc-100 dark:text-zinc-900" data-on:click="@get('/api/greet')" data-indicator:loading data-attr:disabled="$loading">Ask the server</button>
        <span class="text-sm text-zinc-500" data-cloak data-show="$loading">asking…</span>
      </div>
      <p id="greeting" class="text-sm text-zinc-600 dark:text-zinc-300">The server has not been asked yet.</p>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
