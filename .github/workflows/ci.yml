name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run size

  sdks:
    name: sdks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdks/*/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: astro
        working-directory: sdks/astro
        run: |
          npm ci
          npm test
      - name: hono
        working-directory: sdks/hono
        run: |
          npm ci
          npm test

  rust:
    name: rust sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The crate embeds the client, so the JavaScript build comes first.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - name: fmt, clippy, tests
        working-directory: sdks/rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-features --all-targets -- -D warnings
          cargo test --all-features
          cargo build --example axum --features axum,client
      - name: wasm32
        working-directory: sdks/rust
        run: |
          cargo check --target wasm32-unknown-unknown --features axum,worker,scan
          cargo check -p sigmx-example-worker --target wasm32-unknown-unknown
      - name: worker example asset step
        working-directory: sdks/rust/examples/worker
        run: |
          cargo run --manifest-path assetc/Cargo.toml
          test -f public/sigmx.js && grep -q createSigmx public/sigmx.js
          # Per-module imports, never the barrel: the selection must be what ships.
          ! grep -q 'plugins/index.js' public/sigmx.js

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  website:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdks/astro/package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: build @sigmx/astro
        working-directory: sdks/astro
        run: |
          npm ci
          npm run build
      - name: build the site
        working-directory: website
        run: |
          npm ci
          npm run build

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdks/*/package-lock.json
            examples/*/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: build the SDKs
        run: |
          (cd sdks/hono && npm ci && npm run build)
          (cd sdks/astro && npm ci && npm run build)
      # Each example installs its published dependencies from its lockfile, then the packages built
      # from this checkout are linked over them (without touching the lockfile), so the examples are
      # tested against the code in the pull request rather than the last release.
      - name: vite
        working-directory: examples/vite
        run: |
          npm ci
          npm install --no-save ../..
          npm run build
      - name: astro
        working-directory: examples/astro
        run: |
          npm ci
          npm install --no-save ../.. ../../sdks/astro
          npm run build
      - name: hono
        working-directory: examples/hono
        run: |
          npm ci
          npm install --no-save ../.. ../../sdks/hono
          npm run build
          npm run check
      - name: express
        working-directory: examples/express
        run: |
          npm ci
          npm install --no-save ../..
          npm run build
          node --check server.js
